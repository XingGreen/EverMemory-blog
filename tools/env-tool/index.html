<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环境变量 · 本地工具</title>
<!-- 控件样式直接用主项目那一份，不另起一套 -->
<link rel="stylesheet" href="/assets/ui-base.css">
<style>
/* token 取自 src/styles/variables.styl 暗色档与 admin.css，hue 270 */
:root {
	--hue: 270;
	--primary: oklch(0.75 0.14 var(--hue));
	--primary-foreground: #ffffff;
	--page-bg: oklch(0.16 0.014 var(--hue));
	--card-bg: oklch(0.23 0.015 var(--hue));
	--deep-text: oklch(0.95 0.01 var(--hue));
	--content-meta: rgba(255, 255, 255, 0.6);
	--line-divider: rgba(255, 255, 255, 0.08);
	--line-color: rgba(255, 255, 255, 0.16);
	--input-bg: rgba(255, 255, 255, 0.05);
	--input-border: rgba(255, 255, 255, 0.1);
	--btn-regular-bg: oklch(0.33 0.035 var(--hue));
	--btn-regular-bg-hover: oklch(0.38 0.04 var(--hue));
	--btn-regular-bg-active: oklch(0.43 0.045 var(--hue));
	--btn-content: oklch(0.75 0.1 var(--hue));
	--success: #4ade80;
	--destructive: oklch(0.6375 0.2489 20.732);
	--shadow-button: 0 4px 12px rgba(255, 255, 255, 0.1);
	--shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
	--font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
		"Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
		"Microsoft YaHei", "Noto Sans SC", sans-serif;
	--font-mono: "JetBrains Mono", "Monaco", "Consolas", monospace;
	--fs-page: 1.75rem;
	--fs-item: 1.0625rem;
	--fs-body: 0.875rem;
	--fs-meta: 0.75rem;
	--fs-data: 0.6875rem;
	--gutter: 1.5rem;
}

* { box-sizing: border-box; }
body {
	margin: 0;
	padding: 24px var(--gutter) 96px;
	background: var(--page-bg);
	color: var(--deep-text);
	font-family: var(--font-sans);
	font-size: var(--fs-body);
	line-height: 1.6;
	-webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; }
h1 { margin: 0; font-size: var(--fs-page); font-weight: 650; line-height: 1.35; }
.lede { margin: 4px 0 0; color: var(--content-meta); font-size: var(--fs-meta); max-width: 56ch; }

.head {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 16px;
}
.head .total {
	margin-top: 6px;
	font-size: var(--fs-meta);
	color: var(--content-meta);
	white-space: nowrap;
}
.head .total b {
	font-family: var(--font-mono);
	font-size: var(--fs-data);
	font-weight: 500;
	color: var(--deep-text);
}
.notice {
	margin: 12px 0 0;
	padding: 10px 12px;
	border: 1px dashed var(--input-border);
	border-radius: 10px;
	font-size: var(--fs-meta);
	color: var(--content-meta);
}
.key-saved {
	display: flex;
	align-items: center;
	gap: 10px;
	min-height: 36px;
	padding: 0 12px;
	border: 1px solid var(--input-border);
	border-radius: 10px;
	background: var(--input-bg);
	font-size: var(--fs-meta);
}
.key-saved .ok { color: var(--success); }
.key-saved .grow { flex: 1; }
.ghost-toggle {
	border: 0;
	background: none;
	padding: 0;
	min-height: 24px;
	color: var(--primary);
	font-family: inherit;
	font-size: var(--fs-meta);
	cursor: pointer;
	margin-left: 8px;
}

.card {
	margin-top: 16px;
	background: var(--card-bg);
	border-radius: 16px;
	box-shadow: var(--shadow-sm);
	overflow: hidden;
}

.group { padding: 20px var(--gutter); }
.group + .group { border-top: 1px solid var(--line-divider); }

.ghead { display: flex; align-items: baseline; gap: 8px; }
.ghead h2 { margin: 0; font-size: var(--fs-item); font-weight: 650; }
.ghead .sub { font-size: var(--fs-meta); color: var(--content-meta); }
.ghead .count { margin-left: auto; font-size: var(--fs-meta); color: var(--content-meta); }
.ghead .count.done { color: var(--success); }
.ghint { margin: 4px 0 8px; font-size: var(--fs-meta); color: var(--content-meta); }

.row {
	display: grid;
	grid-template-columns: 200px minmax(0, 1fr);
	gap: 24px;
	align-items: start;
	padding: 12px 0;
	border-bottom: 1px solid var(--line-divider);
}
.row:last-child { border-bottom: 0; }
.name { font-size: var(--fs-meta); font-weight: 600; padding-top: 9px; }
.name .req { color: var(--primary); margin-left: 2px; }
.hint { margin: 2px 0 0; font-size: var(--fs-meta); color: var(--content-meta); line-height: 1.5; }
.control { display: flex; gap: 8px; align-items: flex-start; }
.control > .ui-input { flex: 1 1 auto; min-width: 0; }
textarea.ui-input {
	min-height: 116px;
	font-family: var(--font-mono);
	font-size: var(--fs-meta);
	padding-block: 8px;
	resize: vertical;
}
.trace {
	margin: 4px 0 0;
	font-family: var(--font-mono);
	font-size: var(--fs-data);
	color: var(--content-meta);
}
.trace.ok { color: var(--success); }
.trace.bad { color: var(--destructive); }
.trace .link { margin-right: 12px; }

.link {
	border: none;
	background: none;
	padding: 0;
	min-height: 24px;
	color: var(--primary);
	font-family: inherit;
	font-size: var(--fs-meta);
	cursor: pointer;
}
.link:hover { text-decoration: underline; }

.savebar {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	background: color-mix(in oklab, var(--page-bg) 94%, transparent);
	border-top: 1px solid var(--line-divider);
	backdrop-filter: blur(6px);
}
.savebar .inner {
	max-width: 960px;
	margin: 0 auto;
	padding: 12px var(--gutter);
	display: flex;
	align-items: center;
	gap: 12px;
}
.savebar .state { font-size: var(--fs-meta); color: var(--content-meta); }
.savebar .grow { flex: 1; }

@media (max-width: 720px) {
	.row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
	.name { padding-top: 0; }
}
</style>
</head>
<body class="dark">
<div class="wrap">
	<div class="head">
		<div>
			<h1>环境变量</h1>
			<p class="lede">保存到项目根目录的 .env.local。本页只在本机运行，不需要登录后台，也不会上传任何值。</p>
		</div>
		<span class="total" id="total"></span>
	</div>
	<p class="notice" id="notice" hidden>还没有 .env.local。填完下面几项、点保存时就会创建它。</p>
	<div class="card" id="card"></div>
</div>

<div class="savebar">
	<div class="inner">
		<span class="state" id="dirty">读取中…</span>
		<span class="grow"></span>
		<button class="ui-btn ui-btn-sm ui-btn-primary" id="save">保存</button>
	</div>
</div>

<script>
const GROUPS = [
	{ id: "github", title: "GitHub App 凭据", sub: "写入仓库", hint: "都在 GitHub 的 App 设置页" },
	{ id: "auth", title: "管理员认证", sub: "后台登录", hint: "OAuth 凭据在同一个 App 页面，用户 ID 来自你的 GitHub 账号" },
	{ id: "turnstile", title: "人机验证", sub: "可选", hint: "在 Cloudflare 的 Turnstile 里创建站点后填写", optionalGroup: true },
];

const FIELDS = [
	{ key: "GITHUB_OWNER", group: "github", label: "仓库所有者", hint: "用户或组织名，不带 @", required: true, example: "XingGreen" },
	{ key: "GITHUB_REPO", group: "github", label: "仓库名称", hint: "不带 .git 后缀", required: true, example: "EverMemory-blog" },
	{ key: "GITHUB_BRANCH", group: "github", label: "仓库分支", hint: "通常是 master 或 main", required: true, example: "master" },
	{ key: "GITHUB_APP_ID", group: "github", label: "App ID", hint: "App 设置页顶部的数字", required: true, example: "4423412" },
	{ key: "GITHUB_INSTALLATION_ID", group: "github", label: "安装 ID", hint: "填了 App ID 与私钥后可以自动获取", required: true, example: "149804847", probe: true },
	{ key: "GITHUB_PRIVATE_KEY", group: "github", label: "App 私钥", hint: "下载 .pem 后整段粘贴，保存时自动压成单行", required: true, multiline: true },
	{ key: "GITHUB_PRIVATE_KEY_PATH", group: "github", label: "私钥文件路径", hint: "可选。不填则用上面粘贴的私钥", required: false, example: ".key/blog.pem" },
	{ key: "GITHUB_APP_CLIENT_ID", group: "auth", label: "OAuth Client ID", hint: "同一个 App 页面里的 Client ID", required: true, example: "Iv23li…" },
	{ key: "GITHUB_APP_CLIENT_SECRET", group: "auth", label: "OAuth Client Secret", hint: "点 Generate 生成，只显示一次", required: true, secret: true },
	{ key: "ADMIN_GITHUB_ID", group: "auth", label: "管理员 GitHub 用户 ID", hint: "打开 api.github.com/user，取返回里的 id", required: true, example: "238927366" },
	{ key: "ADMIN_BREAKGLASS_TOKEN", group: "auth", label: "应急登录令牌", hint: "一般留空，GitHub 登不上时才用", required: false, secret: true },
	{ key: "ADMIN_JWT_SECRET", group: "auth", label: "会话签名", hint: "不用手填，点「生成」即可", required: true, secret: true, generate: true },
	{ key: "ADMIN_ALERT_WEBHOOK", group: "auth", label: "登录告警 Webhook", hint: "可选，留空则不发送", required: false, example: "https://…" },
	{ key: "TURNSTILE_SITE_KEY", group: "turnstile", label: "Turnstile Site Key", hint: "Cloudflare → Turnstile → 站点", required: false },
	{ key: "TURNSTILE_SECRET_KEY", group: "turnstile", label: "Turnstile Secret Key", hint: "和 Site Key 一起填，只填一个登录会被拒", required: false, secret: true },
];

const values = {};
const original = {};
const state = { exists: true, collapsed: { turnstile: true } };
let keyEditing = false;
let keyBackup = "";
const card = document.getElementById("card");
const dirtyEl = document.getElementById("dirty");
const saveBtn = document.getElementById("save");
const totalEl = document.getElementById("total");
const noticeEl = document.getElementById("notice");

const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const filled = (f) => (values[f.key] || "").trim().length > 0;

function render() {
	card.innerHTML = GROUPS.map((g) => {
		const items = FIELDS.filter((f) => f.group === g.id);
		const req = items.filter((f) => f.required);
		const done = req.filter(filled).length;
		const tone = done === req.length && req.length > 0 ? "count done" : "count";
		const collapsed = Boolean(state.collapsed[g.id]);
		const counter = g.optionalGroup ? "可选" : `${done} / ${req.length} 已配`;
		return `
		<section class="group">
			<div class="ghead">
				<h2>${escapeHtml(g.title)}</h2>
				<span class="sub">${escapeHtml(g.sub)}</span>
				<span class="${tone}">${counter}</span>
				${g.optionalGroup ? `<button type="button" class="ghost-toggle" data-toggle="${g.id}">${collapsed ? "展开" : "收起"}</button>` : ""}
			</div>
			<p class="ghint">${escapeHtml(g.hint)}</p>
			${collapsed ? "" : items.map(row).join("")}
		</section>`;
	}).join("");
	bind();
	refreshDirty();
}

function refreshTotal() {
	const req = FIELDS.filter((f) => f.required);
	const done = req.filter(filled).length;
	if (totalEl) totalEl.innerHTML = `必要项 <b>${done}</b> / ${req.length}`;
}

function row(f) {
	const value = values[f.key] || "";
	const attrs = `data-key="${f.key}" spellcheck="false" placeholder="${escapeHtml(f.example || "")}"`;
	const saved = f.multiline && !keyEditing && value.length > 200;

	let control;
	if (saved) {
		control = `<div class="key-saved"><span class="ok">✓</span><span>已保存 · ${value.length} 个字符</span><span class="grow"></span><button type="button" class="link" data-replace="${f.key}">替换</button></div>`;
	} else if (f.multiline) {
		control = `<textarea class="ui-input" ${attrs} rows="4" placeholder="-----BEGIN … PRIVATE KEY----- 整段粘贴">${escapeHtml(value)}</textarea>`;
	} else {
		control = `<input class="ui-input${f.secret ? "" : " mono"}" ${attrs} type="${f.secret ? "password" : "text"}" value="${escapeHtml(value)}" />`;
	}

	const extra = [];
	if (f.generate) extra.push(`<button type="button" class="ui-btn ui-btn-sm ui-btn-soft" data-generate="${f.key}">生成</button>`);
	if (f.probe) extra.push(`<button type="button" class="ui-btn ui-btn-sm ui-btn-soft" data-probe="1">从 GitHub 获取</button>`);
	if (f.multiline && keyEditing) extra.push(`<button type="button" class="ui-btn ui-btn-sm ui-btn-ghost" data-cancel-key="1">取消</button>`);

	return `
	<div class="row">
		<div>
			<div class="name">${escapeHtml(f.label)}${f.required ? '<span class="req">*</span>' : ""}</div>
			<p class="hint">${escapeHtml(f.hint)}</p>
		</div>
		<div>
			<div class="control">${control}${extra.join("")}</div>
			${f.probe ? '<p class="trace" data-probe-result></p>' : ""}
		</div>
	</div>`;
}

function bind() {
	card.querySelectorAll("[data-key]").forEach((el) => {
		el.addEventListener("input", (e) => {
			values[e.target.dataset.key] = e.target.value;
			refreshDirty();
			updateCount(el.closest(".group"));
		});
	});

	card.querySelectorAll("[data-toggle]").forEach((btn) => {
		btn.addEventListener("click", () => {
			state.collapsed[btn.dataset.toggle] = !state.collapsed[btn.dataset.toggle];
			render();
		});
	});

	card.querySelectorAll("[data-replace]").forEach((btn) => {
		btn.addEventListener("click", () => {
			keyBackup = original[btn.dataset.replace] || "";
			values[btn.dataset.replace] = "";
			keyEditing = true;
			render();
		});
	});

	card.querySelectorAll("[data-cancel-key]").forEach((btn) => {
		btn.addEventListener("click", () => {
			values.GITHUB_PRIVATE_KEY = keyBackup;
			keyEditing = false;
			render();
		});
	});

	card.querySelectorAll("[data-generate]").forEach((btn) => {
		btn.addEventListener("click", () => {
			const key = btn.dataset.generate;
			const bytes = crypto.getRandomValues(new Uint8Array(48));
			values[key] = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
			const input = card.querySelector(`[data-key="${key}"]`);
			if (input) input.value = values[key];
			refreshDirty();
		});
	});

	card.querySelectorAll("[data-probe]").forEach((btn) => {
		btn.addEventListener("click", async () => {
			const out = card.querySelector("[data-probe-result]");
			if (out) out.textContent = "正在向 GitHub 询问…";
			btn.disabled = true;
			try {
				const res = await fetch("/api/probe");
				const data = await res.json();
				if (!data.ok) {
					if (out) {
						out.className = "trace bad";
						out.textContent = data.message || "获取失败";
					}
					return;
				}
				if (!data.candidates || data.candidates.length === 0) {
					if (out) {
						out.className = "trace";
						out.textContent = data.message || "没有可用的安装";
					}
					return;
				}
				if (out) {
					out.className = "trace ok";
					out.textContent = data.message;
					const pick = document.createElement("p");
					pick.className = "trace";
					for (const c of data.candidates) {
						const b = document.createElement("button");
						b.type = "button";
						b.className = "link";
						b.textContent = `用 ${c.id}（${c.account}）`;
						b.addEventListener("click", () => {
							values.GITHUB_INSTALLATION_ID = c.id;
							const input = card.querySelector('[data-key="GITHUB_INSTALLATION_ID"]');
							if (input) input.value = c.id;
							refreshDirty();
						});
						pick.appendChild(b);
					}
					out.after(pick);
				}
			} finally {
				btn.disabled = false;
			}
		});
	});
}

function updateCount(group) {
	if (!group) return;
	const title = group.querySelector("h2")?.textContent;
	const g = GROUPS.find((x) => x.title === title);
	if (!g) return;
	const req = FIELDS.filter((f) => f.group === g.id && f.required);
	const done = req.filter(filled).length;
	const el = group.querySelector(".count");
	if (el) {
		el.textContent = `${done} / ${req.length} 已配`;
		el.className = done === req.length && req.length > 0 ? "count done" : "count";
	}
}

function changedKeys() {
	return FIELDS.map((f) => f.key).filter((k) => (values[k] || "") !== (original[k] || ""));
}

function refreshDirty() {
	const n = changedKeys().length;
	dirtyEl.textContent = n === 0 ? "没有改动" : `还有 ${n} 项未保存`;
	saveBtn.disabled = n === 0;
	refreshTotal();
}

async function load() {
	const res = await fetch("/api/state");
	const data = await res.json();
	state.exists = Boolean(data.exists);
	if (noticeEl) noticeEl.hidden = state.exists;
	for (const f of FIELDS) {
		const v = data.values?.[f.key] ?? "";
		values[f.key] = v;
		original[f.key] = v;
	}
	render();

	const empty = ["GITHUB_OWNER", "GITHUB_REPO", "GITHUB_BRANCH"].every((k) => !(values[k] || "").trim());
	if (empty) {
		try {
			const d = await (await fetch("/api/discover")).json();
			if (d.repo) {
				values.GITHUB_OWNER = d.repo.owner;
				values.GITHUB_REPO = d.repo.repo;
				values.GITHUB_BRANCH = d.repo.branch;
				render();
			}
		} catch {
			/* 读不到就留空 */
		}
	}
}

saveBtn.addEventListener("click", async () => {
	saveBtn.disabled = true;
	dirtyEl.textContent = "保存中…";
	const payload = {};
	for (const k of changedKeys()) payload[k] = values[k];
	try {
		const res = await fetch("/api/write", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ values: payload }),
		});
		const data = await res.json();
		if (!data.ok) throw new Error(data.message || "保存失败");
		for (const k of Object.keys(payload)) original[k] = values[k];
		dirtyEl.textContent = `已保存 ${data.saved} 项 · 重启服务后生效`;
	} catch (error) {
		dirtyEl.textContent = `保存失败：${error.message}`;
		saveBtn.disabled = false;
	}
});

load().catch((error) => {
	dirtyEl.textContent = `读取失败：${error.message}`;
});
</script>
</body>
</html>
